name: PWA lifecycle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pwa:
    name: Validate install, update, and offline use
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Exercise the PWA lifecycle
        run: node tools/check-pwa.cjs

      - name: Validate the Composition Engine against reference archetypes
        run: node tools/check-composition-engine.cjs

      - name: Validate contextual strategic fit and gap coverage
        run: node tools/check-draft-strategic-fit.cjs

      - name: Validate contextual draft explanations without changing rankings
        run: node tools/check-draft-explanations.cjs

      - name: Validate strategic evidence in final diagnoses
        run: node tools/check-final-diagnosis-precision.cjs

      - name: Validate the internal Diagnostic Engine
        run: node tools/check-diagnostic-engine.cjs

      - name: Validate the internal Composition Optimizer
        run: node tools/check-composition-optimizer.cjs

      - name: Validate single-replacement identity against a complete team diagnosis
        run: node tools/check-strategic-composition-optimizer.cjs

      - name: Validate the internal Strategic Recommendation Engine
        run: node tools/check-strategic-recommendation-engine.cjs

      - name: Validate recommendation audit reproducibility
        run: node tools/check-recommendation-audit.cjs

      - name: Validate patch 26.21 role viability and conservative recommendations
        run: node tools/check-role-viability.cjs

      - name: Audit issue 52 curated roles and profile coverage
        run: node tools/check-editorial-role-evidence.cjs

      - name: Validate the Championship Candidate Mapper
        run: node tools/check-championship-candidate-mapper.cjs

      - name: Validate the Candidate Evaluator
        run: node tools/check-candidate-evaluator.cjs

      - name: Validate the Strategic Recommendation Presenter
        run: node tools/check-strategic-recommendation-presenter.cjs

      - name: Validate visible strategic recommendation integration
        run: node tools/check-strategic-recommendation-presenter-integration.cjs

      - name: Validate the Strategic Recommendation Polisher
        run: node tools/check-strategic-recommendation-polisher.cjs

      - name: Validate the Strategic Team Recomposer
        run: node tools/check-strategic-team-recomposer.cjs

      - name: Validate the Strategic Risk Analyzer
        run: node tools/check-strategic-risk-analyzer.cjs

      - name: Validate the Strategic Counterplay Advisor
        run: node tools/check-strategic-counterplay-advisor.cjs

      - name: Validate the Ban Prioritizer
        run: node tools/check-ban-prioritizer.cjs

      - name: Validate the Ban Recommendation Presenter
        run: node tools/check-ban-recommendation-presenter.cjs

      - name: Validate strategic report ban integration
        run: node tools/check-strategic-report-ban-integration.cjs

      - name: Validate composition stability
        run: node tools/check-composition-stability-engine.cjs

      - name: Validate win-condition coherence
        run: node tools/check-win-condition-coherence-engine.cjs

      - name: Validate the internal Correction Engine
        run: node tools/check-correction-engine.cjs

      - name: Validate the internal Protection Engine
        run: node tools/check-protection-engine.cjs

      - name: Validate the internal Confidence Engine
        run: node tools/check-confidence-engine.cjs

      - name: Validate the compact Diagnostic Summary
        run: node tools/check-diagnostic-summary-engine.cjs

      - name: Validate secondary observations
        run: node tools/check-secondary-observation-engine.cjs

      - name: Validate final strategic state
        run: node tools/check-strategic-state-engine.cjs

      - name: Validate optional strategic closing
        run: node tools/check-strategic-closing-engine.cjs

      - name: Validate strategic report closing
        run: node tools/check-strategic-report-closing.cjs

      - name: Validate risk and counterplay visibility integration
        run: node tools/check-strategic-report-risk-integration.cjs

      - name: Validate final recommendation evidence and unchanged decisions
        run: node tools/check-final-recommendation-explanations.cjs

      - name: Validate the v2 strategic report
        run: node tools/check-strategic-report.cjs

      - name: Validate composition logic against the workbook
        run: node tools/check-composition.cjs

      - name: Check responsive layout and keyboard accessibility
        run: node tools/check-ux.cjs

      - name: Check release metadata synchronization
        run: npm run version:check
